name: Keep API awake

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: api-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    if: ${{ vars.API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check API liveness
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$API_BASE_URL" != https://* ]]; then
            echo 'API_BASE_URL must be the HTTPS origin of the API.' >&2
            exit 1
          fi
          curl --fail --silent --show-error --proto '=https' \
            --connect-timeout 15 --max-time 90 \
            --retry 2 --retry-delay 5 --retry-max-time 200 \
            --output /dev/null \
            --write-out 'HTTP %{http_code} in %{time_total}s\n' \
            "${API_BASE_URL%/}/api/health"
